<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="t d">
  <title id="t">EchoSmith 全流程</title>
  <desc id="d">从素材到批量合成的完整链路:视频/音频经提音轨、人声分离、静音切分、自动打标生成训练清单,六阶段训练产出 SoVITS 与 GPT 权重,打包为声线卡交给 EchoRunner 批量合成。</desc>

  <rect width="1200" height="300" rx="24" fill="#0E1424"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <!-- ===== 上行:素材 → 训练清单(居中:左右各留 52) ===== -->
    <g transform="translate(52 40)">
      <rect width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="20" y="32" font-size="21" font-weight="600" fill="#F1F5F9">① 素材流水线</text>
      <text x="20" y="60" font-size="18" fill="#94A3B8">视频/音频 → 32k 音轨</text>

      <rect x="282" width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="302" y="32" font-size="21" font-weight="600" fill="#F1F5F9">② 静音切分</text>
      <text x="302" y="60" font-size="18" fill="#94A3B8">&lt;10s 切片,阈值可调</text>

      <rect x="564" width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="584" y="32" font-size="21" font-weight="600" fill="#F1F5F9">③ 自动打标</text>
      <text x="584" y="60" font-size="18" fill="#94A3B8">FunASR / 引擎内置回退</text>

      <rect x="846" width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="866" y="32" font-size="21" font-weight="600" fill="#F1F5F9">④ 训练清单</text>
      <text x="866" y="60" font-size="17" fill="#94A3B8" font-family="Consolas,'Courier New','Microsoft YaHei',monospace">clips/ + 数据集.list</text>

      <path d="M250 42 H 278" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
      <path d="M532 42 H 560" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
      <path d="M814 42 H 842" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
    </g>

    <!-- 转折:④ 底部中心 → ⑤ 顶部中心 -->
    <path d="M971 124 V 164" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- ===== 下行:训练 → 声线卡 → 合成(从右往左) ===== -->
    <g transform="translate(52 168)">
      <rect x="846" width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="866" y="32" font-size="21" font-weight="600" fill="#F1F5F9">⑤ 六阶段训练</text>
      <text x="866" y="60" font-size="18" fill="#94A3B8">text/hubert/sv/semantic/s2/s1</text>

      <rect x="564" width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="584" y="32" font-size="21" font-weight="600" fill="#F1F5F9">⑥ 声线卡</text>
      <text x="584" y="60" font-size="18" fill="#94A3B8">权重 + 情感参考音频</text>

      <rect x="282" width="250" height="84" rx="12" fill="#12251A" stroke="#1E4D32"/>
      <text x="302" y="32" font-size="21" font-weight="600" fill="#22C55E">⑦ 批量合成</text>
      <text x="302" y="60" font-size="18" fill="#8FBCA3">EchoRunner 无缝衔接</text>

      <rect width="250" height="84" rx="12" fill="#131C30" stroke="#243250"/>
      <text x="20" y="32" font-size="21" font-weight="600" fill="#F1F5F9">产出</text>
      <text x="20" y="60" font-size="17" fill="#94A3B8" font-family="Consolas,'Courier New','Microsoft YaHei',monospace">*.wav / *.mp3</text>

      <path d="M846 42 H 818" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
      <path d="M564 42 H 536" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
      <path d="M282 42 H 254" stroke="#22C55E" stroke-width="2" marker-end="url(#arr)"/>
    </g>
  </g>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22C55E"/>
    </marker>
  </defs>
</svg>
